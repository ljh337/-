<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073b2a">
  <title>斗地主 · 玩家</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #073b2a; color: #f4f4e8; }
    header { padding: 14px 16px; background: #052d21; border-bottom: 1px solid #22664b; }
    .header-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .header-meta { flex: 0 0 auto; color: #bbd4c8; font-size: 11px; line-height: 1.5; text-align: right; }
    h1 { margin: 0; font-size: 20px; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 14px; }
    .panel { background: #0d5038; border: 1px solid #267352; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .muted { color: #bbd4c8; font-size: 13px; }
    .status { font-weight: 700; min-height: 25px; color: #ffe08a; }
    .landlord-status { margin: 5px 0 10px; color: #ffdf77; font-size: 16px; font-weight: 800; }
    .action-notice { min-height: 52px; display: grid; place-items: center; margin-bottom: 8px; padding: 9px; border: 1px solid #e6c86e; border-radius: 10px; background: #073e2d; color: #ffe08a; text-align: center; font-size: 21px; font-weight: 800; overflow-wrap: anywhere; }
    .action-notice.idle { border-color: #267352; color: #bbd4c8; font-size: 15px; font-weight: 600; }
    .landlord-reveal { margin: 8px 0; padding: 10px; border: 2px solid #ffdf77; border-radius: 12px; background: #174b34; text-align: center; color: #ffdf77; font-weight: 800; }
    .landlord-reveal-title { margin-bottom: 8px; }
    .reveal-cards { display: flex; justify-content: center; gap: 8px; }
    .reveal-card { min-width: 52px; padding: 8px 10px; border-radius: 8px; background: #fffdf3; color: #161616; font-size: 20px; }
    .reveal-card.red { color: #ce2633; }
    label { display: block; margin: 10px 0 5px; font-size: 14px; }
    input { width: 100%; min-height: 46px; border: 1px solid #7cab91; border-radius: 9px; padding: 10px 12px; background: #062e22; color: white; font-size: 17px; }
    button { border: 0; border-radius: 10px; min-height: 46px; padding: 10px 16px; color: white; background: #178451; font-size: 16px; font-weight: 700; touch-action: manipulation; }
    button:disabled { opacity: .45; }
    button.secondary { background: #355b4a; }
    button.warn { background: #aa4b35; }
    .full { width: 100%; margin-top: 12px; }
    .hidden { display: none !important; }
    .players { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .player { min-width: 0; padding: 10px 6px; border-radius: 10px; background: #073e2d; text-align: center; font-size: 13px; overflow-wrap: anywhere; }
    .player.current { outline: 2px solid #ffdf77; }
    .player.me { color: #a7f0c2; }
    .table-play { min-height: 92px; display: grid; place-items: center; text-align: center; color: #ffe08a; font-size: 18px; }
    .hand-wrap { overflow-x: auto; padding: 4px 0 10px; -webkit-overflow-scrolling: touch; }
    .hand { display: flex; min-width: max-content; padding: 0 6px; }
    .card { width: 54px; height: 80px; margin-left: -12px; border: 2px solid #e5e4d6; border-radius: 8px; background: #fffdf3; color: #161616; display: grid; place-items: center; font-size: 17px; font-weight: 800; box-shadow: 0 2px 5px #001a10aa; }
    .card:first-child { margin-left: 0; }
    .card.red { color: #ce2633; }
    .card.selected { transform: translateY(-12px); border-color: #ffcf53; background: #fff2b8; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .actions button { width: 100%; }
    ol { margin: 0; padding-left: 24px; max-height: 210px; overflow: auto; }
    li { padding: 3px 0; font-size: 13px; color: #dce9dd; }
    .error { color: #ffb3a7; min-height: 20px; margin-top: 8px; }
    @media (min-width: 620px) {
      main { padding-top: 22px; }
      .card { width: 62px; height: 88px; margin-left: -8px; }
      .card:first-child { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header><div class="header-content"><h1>♠ 斗地主 · 玩家端</h1><div class="header-meta">编写者：Ljhforout@outlook.com<br>隧道服务提供者：Cloudflare</div></div></header>
  <main>
    <section id="join-panel" class="panel">
      <div class="muted">输入电脑端创建的房间号即可加入；真人玩家人数和 AI 座位由电脑端设置。</div>
      <form id="join-form">
        <label for="room">房间号</label>
        <input id="room" maxlength="6" autocomplete="off" required placeholder="例如 4FA2BC">
        <label for="name">玩家昵称</label>
        <input id="name" maxlength="8" autocomplete="nickname" required placeholder="最多 8 个字符">
        <div class="muted">最多 8 个字符；不能使用与电脑玩家或系统相似的名称。</div>
        <button class="full" type="submit">加入牌局</button>
      </form>
      <div id="join-connection" class="muted" role="status"></div>
      <div id="join-error" class="error" role="status"></div>
    </section>

    <section id="game-panel" class="hidden">
      <div class="panel">
        <div class="muted"><span id="game-title"></span> · 房间 <span id="game-code"></span></div>
        <div id="connection" class="muted">连接中…</div>
        <div id="status" class="status" aria-live="polite"></div>
        <div id="landlord-status" class="landlord-status" aria-live="polite">地主：牌局开始后产生</div>
        <div id="players" class="players"></div>
      </div>
      <div class="panel">
        <div class="muted">桌面 · <span id="turn-label"></span></div>
        <div id="action-notice" class="action-notice idle" aria-live="polite">等待玩家操作</div>
        <div id="landlord-reveal" class="landlord-reveal hidden" role="status" aria-live="polite"></div>
        <div id="table-play" class="table-play">等待发牌</div>
      </div>
      <div class="panel">
        <div class="muted">我的手牌 · <span id="hand-count">0</span> 张（点选要出的牌）</div>
        <div class="hand-wrap"><div id="hand" class="hand"></div></div>
        <div id="game-actions" class="actions"></div>
        <div id="game-error" class="error" role="status"></div>
      </div>
      <div class="panel">
        <div class="muted">本局操作记录</div>
        <ol id="events"></ol>
      </div>
      <button id="leave" class="secondary full" type="button">退出此设备</button>
    </section>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    let savedRoom = localStorage.getItem("landlord-room") || "";
    let savedToken = localStorage.getItem("landlord-token") || "";
    const selected = new Set();
    let socket;
    let state;
    let reconnectTimer;
    let pendingJoin;
    let currentGameId = "";
    let lastSeenEventNo = null;
    let operationQueue = [];
    let operationTimer;
    let landlordRevealTimer;
    let landlordRevealId = null;
    let landlordRevealExpiresAt = 0;
    const params = new URLSearchParams(location.search);
    const requestedRoom = (params.get("room") || "").trim().toUpperCase();
    const storedRoom = savedRoom;
    if (requestedRoom && requestedRoom !== savedRoom.toUpperCase()) {
      localStorage.removeItem("landlord-room");
      localStorage.removeItem("landlord-token");
      savedRoom = "";
      savedToken = "";
    }
    $("room").value = (requestedRoom || savedRoom).toUpperCase();

    function showError(message) {
      $("game-error").textContent = message || "";
      $("join-error").textContent = message || "";
    }

    function isComputerLikeName(name) {
      return /(?:电脑|机器人|系统)|(?:^|[^a-z])(?:ai|bot|cpu|robot|computer)(?:$|[^a-z])/i
        .test(name);
    }

    function setConnectionStatus(message) {
      $("connection").textContent = message;
      $("join-connection").textContent = message;
    }

    function playerPhaseStatus(player, phase, rematchVotes) {
      if (phase === "lobby") return player.ready ? "已准备" : "未准备";
      if (phase === "finished") {
        return player.human
          ? (rematchVotes.includes(player.seat) ? "已确认再开" : "等待决定")
          : "等待再开";
      }
      if (phase === "closed") return "房间已关闭";
      return player.human ? "对局中" : "自动行动";
    }

    function clearOperationQueue() {
      clearTimeout(operationTimer);
      operationTimer = null;
      operationQueue = [];
      lastSeenEventNo = null;
      $("action-notice").textContent = "等待玩家操作";
      $("action-notice").classList.add("idle");
    }

    function renderLandlordReveal() {
      const panel = $("landlord-reveal");
      const reveal = state?.landlord_reveal;
      if (!reveal || !Array.isArray(reveal.cards) || !reveal.cards.length) {
        clearTimeout(landlordRevealTimer);
        landlordRevealTimer = null;
        landlordRevealId = null;
        landlordRevealExpiresAt = 0;
        panel.replaceChildren();
        panel.classList.add("hidden");
        return;
      }
      if (reveal.id !== landlordRevealId) {
        clearTimeout(landlordRevealTimer);
        landlordRevealId = reveal.id;
        landlordRevealExpiresAt = Date.now() + reveal.remaining_ms;
      }
      const remaining = landlordRevealExpiresAt - Date.now();
      if (remaining <= 0) {
        panel.classList.add("hidden");
        return;
      }
      panel.replaceChildren();
      const title = document.createElement("div");
      title.className = "landlord-reveal-title";
      title.textContent = "地主底牌 · 全桌公开";
      panel.append(title);
      const cards = document.createElement("div");
      cards.className = "reveal-cards";
      for (const label of reveal.cards) {
        const card = document.createElement("span");
        card.className = `reveal-card${/[♥♦]|大王/.test(label) ? " red" : ""}`;
        card.textContent = label;
        cards.append(card);
      }
      panel.append(cards);
      panel.classList.remove("hidden");
      clearTimeout(landlordRevealTimer);
      landlordRevealTimer = setTimeout(() => {
        landlordRevealTimer = null;
        renderLandlordReveal();
      }, remaining);
    }

    function describeOperation(event) {
      const name = event.player_name || "系统";
      const cards = event.details?.cards;
      const labels = {
        player_joined: "加入牌局",
        ready_changed: event.details?.ready ? "已准备" : "取消准备",
        dealt: "发牌完成",
        bid: "叫地主",
        robbed: "抢地主",
        decline: "不叫",
        not_robbed: "不抢",
        redealt: "无人叫地主，重新发牌",
        passed: "不出",
        rematch_voted: event.details?.confirmed
          ? "确认再开一局" : "取消再开一局",
        rematch_started: "新一局开始发牌"
      };
      if (event.action === "cards_played") {
        return `${name} 出牌：${Array.isArray(cards) ? cards.join(" ") : ""}`;
      }
      const label = labels[event.action];
      return label ? `${name}：${label}` : "";
    }

    function captureOperations(nextState) {
      const events = Array.isArray(nextState.events) ? nextState.events : [];
      const numberedEvents = events.filter(event => Number.isInteger(event.event_no));
      if (!numberedEvents.length) return;

      if (lastSeenEventNo === null) {
        lastSeenEventNo = Math.max(...numberedEvents.map(event => event.event_no));
        return;
      }

      for (const event of numberedEvents) {
        if (event.event_no <= lastSeenEventNo) continue;
        const description = describeOperation(event);
        if (description) operationQueue.push(description);
      }
      lastSeenEventNo = Math.max(
        lastSeenEventNo,
        ...numberedEvents.map(event => event.event_no)
      );
      showNextOperation();
    }

    function showNextOperation() {
      if (operationTimer || operationQueue.length === 0) return;
      const notice = $("action-notice");
      notice.textContent = operationQueue.shift();
      notice.classList.remove("idle");
      operationTimer = setTimeout(() => {
        operationTimer = null;
        showNextOperation();
      }, 1600);
    }

    function send(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showError("连接已断开，请稍候重连。");
        return false;
      }
      socket.send(JSON.stringify(message));
      return true;
    }

    function connect(resume) {
      clearTimeout(reconnectTimer);
      if (socket && (socket.readyState === WebSocket.CONNECTING
          || socket.readyState === WebSocket.OPEN)) return;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const connection = new WebSocket(`${protocol}//${location.host}/ws`);
      socket = connection;
      setConnectionStatus("正在连接接收端…");
      connection.addEventListener("open", () => {
        if (socket !== connection) return;
        setConnectionStatus("已连接");
        if (resume) {
          send({type: "resume", game_id: savedRoom, token: savedToken});
        } else if (pendingJoin) {
          send({type: "join", ...pendingJoin});
          pendingJoin = null;
        }
      });
      connection.addEventListener("message", (event) => {
        if (socket !== connection) return;
        let message;
        try { message = JSON.parse(event.data); }
        catch { showError("接收到了无法识别的数据。"); return; }
        if (message.type === "joined") {
          if (currentGameId !== message.game_id) {
            clearOperationQueue();
          }
          currentGameId = message.game_id;
          savedRoom = message.game_id;
          savedToken = message.token;
          localStorage.setItem("landlord-room", message.game_id);
          localStorage.setItem("landlord-token", message.token);
          $("join-panel").classList.add("hidden");
          $("game-panel").classList.remove("hidden");
          $("game-code").textContent = message.game_id;
          showError("");
        } else if (message.type === "state") {
          captureOperations(message.state);
          state = message.state;
          render();
        } else if (message.type === "error") {
          showError(message.message);
          if (message.message.includes("玩家身份无效")) {
            localStorage.removeItem("landlord-room");
            localStorage.removeItem("landlord-token");
            savedRoom = "";
            savedToken = "";
            state = null;
            selected.clear();
            $("game-panel").classList.add("hidden");
            $("join-panel").classList.remove("hidden");
            $("room").value = requestedRoom || currentGameId || storedRoom;
            currentGameId = "";
            clearOperationQueue();
            showError("身份已失效，请重新加入该房间。");
          }
        }
      });
      connection.addEventListener("close", () => {
        if (socket !== connection) return;
        socket = null;
        if ((savedRoom && savedToken) || pendingJoin) {
          setConnectionStatus("连接中断，正在重连…");
          reconnectTimer = setTimeout(
            () => connect(Boolean(savedRoom && savedToken)), 1800
          );
        } else {
          setConnectionStatus("未连接");
          $("join-panel").classList.remove("hidden");
        }
      });
      connection.addEventListener("error", () => {
        if (socket !== connection) return;
        setConnectionStatus("连接暂不可用");
      });
    }

    function makeButton(label, action, style = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      if (style) button.className = style;
      button.addEventListener("click", action);
      return button;
    }

    function addAction(label, serverAction, style = "secondary") {
      $("game-actions").append(makeButton(label, () => {
        showError("");
        send({type: "action", action: serverAction});
      }, style));
    }

    function render() {
      if (!state) return;
      const handIds = new Set(state.hand.map(card => card.id));
      for (const cardId of selected) {
        if (!handIds.has(cardId)) selected.delete(cardId);
      }
      $("game-title").textContent = state.title;
      $("status").textContent = state.message;
      $("hand-count").textContent = String(state.hand.length);
      const landlordStatus = $("landlord-status");
      if (state.landlord != null) {
        const landlord = state.players.find(player => player.seat === state.landlord);
        landlordStatus.textContent = landlord
          ? `地主：${landlord.name}（座位 ${landlord.seat + 1}）`
          : "地主：状态同步中";
      } else if (state.phase === "bidding" && state.bid_candidate != null) {
        const candidate = state.players.find(
          player => player.seat === state.bid_candidate
        );
        landlordStatus.textContent = candidate
          ? `当前叫地主候选：${candidate.name}（座位 ${candidate.seat + 1}）`
          : "当前叫地主候选：状态同步中";
      } else if (state.phase === "bidding") {
        landlordStatus.textContent = "地主：等待玩家叫地主";
      } else {
        landlordStatus.textContent = "地主：牌局开始后产生";
      }
      $("turn-label").textContent = state.phase === "bidding"
        ? `${state.bid_candidate == null ? "叫地主" : "抢地主"}：${state.players[state.bid_turn]?.name || "等待"}`
        : state.current_turn == null ? "等待" : `轮到：${state.players[state.current_turn]?.name || ""}`;
      renderLandlordReveal();

      const players = $("players");
      players.replaceChildren();
      const rematchVotes = state.rematch_votes || [];
      for (const player of state.players) {
        const item = document.createElement("div");
        item.className = "player";
        if (player.seat === state.seat) item.classList.add("me");
        if ((state.phase === "bidding" && player.seat === state.bid_turn)
          || (state.phase === "playing" && player.seat === state.current_turn)) {
          item.classList.add("current");
        }
        const role = player.seat === state.landlord ? " · 地主" : "";
        const identity = player.human
          ? (player.joined ? (player.connected ? "在线" : "离线") : "等待加入")
          : "AI";
        const phaseStatus = playerPhaseStatus(player, state.phase, rematchVotes);
        item.textContent = `${player.name}${role}\n${identity} · ${phaseStatus} · ${player.card_count} 张`;
        players.append(item);
      }

      const play = $("table-play");
      play.replaceChildren();
      if (state.last_play) {
        play.textContent = `${state.last_play.player_name}：${state.last_play.cards.map(card => card.label).join(" ")}`;
      } else {
        play.textContent = state.phase === "playing" ? "新一轮 · 领出" : "等待发牌";
      }

      const hand = $("hand");
      hand.replaceChildren();
      for (const card of state.hand) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";
        if (card.suit === "♥" || card.suit === "♦" || card.suit === "🃏" && card.value === 17) {
          button.classList.add("red");
        }
        if (selected.has(card.id)) button.classList.add("selected");
        button.textContent = card.label;
        button.setAttribute("aria-pressed", String(selected.has(card.id)));
        button.addEventListener("click", () => {
          if (selected.has(card.id)) selected.delete(card.id);
          else selected.add(card.id);
          render();
        });
        hand.append(button);
      }

      const actions = $("game-actions");
      actions.replaceChildren();
      const myTurn = state.phase === "bidding"
        ? state.bid_turn === state.seat
        : state.phase === "playing" && state.current_turn === state.seat;
      if (state.phase === "lobby") {
        const me = state.players.find(player => player.seat === state.seat);
        addAction(me?.ready ? "取消准备" : "准备", "ready", me?.ready ? "warn" : "");
        const joinedHumans = state.players.filter(player => player.human && player.joined).length;
        actions.lastChild.disabled = joinedHumans !== state.human_count;
      } else if (state.phase === "bidding" && myTurn) {
        const canRob = state.bid_candidate != null;
        addAction(canRob ? "抢地主" : "叫地主", canRob ? "rob" : "bid");
        addAction(canRob ? "不抢" : "不叫",
          canRob ? "not_rob" : "decline", "secondary");
      } else if (state.phase === "playing" && myTurn) {
        const playButton = makeButton("出牌", () => {
          const ids = state.hand.filter(card => selected.has(card.id)).map(card => card.id);
          send({type: "action", action: "play", payload: {card_ids: ids}});
        });
        const canPass = Boolean(state.last_play && state.last_play.seat !== state.seat);
        playButton.disabled = selected.size === 0;
        actions.append(playButton);
        actions.append(makeButton("不出", () => send({type: "action", action: "pass"}), "secondary"));
        actions.lastChild.disabled = !canPass;
        actions.append(makeButton("清除选择", () => { selected.clear(); render(); }, "secondary"));
      } else if (state.phase === "finished") {
        const winner = state.players.find(player => player.seat === state.winner);
        const result = document.createElement("div");
        result.className = "muted";
        result.textContent = `${winner?.name || "玩家"}获胜。第 ${state.round_no || 1} 局已结束。`;
        actions.append(result);
        const voteStatus = document.createElement("div");
        voteStatus.className = "muted";
        voteStatus.textContent =
          `再开一局：${rematchVotes.length}/${state.human_count} 位真人已确认；所有真人确认后将沿用原座位和玩家身份重新发牌。`;
        actions.append(voteStatus);
        const meConfirmed = rematchVotes.includes(state.seat);
        addAction(
          meConfirmed ? "取消再开一局" : "确认再开一局",
          "rematch",
          meConfirmed ? "warn" : ""
        );
      }

      const events = $("events");
      events.replaceChildren();
      for (const event of [...state.events].reverse()) {
        const item = document.createElement("li");
        const time = event.timestamp ? new Date(event.timestamp).toLocaleTimeString() : "";
        const detail = event.details?.cards?.join(" ") || "";
        item.textContent = `${time} ${event.player_name || "系统"}：${event.action}${detail ? ` · ${detail}` : ""}`;
        events.append(item);
      }
    }

    $("join-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const gameId = $("room").value.trim().toUpperCase();
      const name = $("name").value.trim();
      if (!gameId || !name) return;
      if ([...name].length > 8) {
        showError("玩家昵称不能超过 8 个字符");
        return;
      }
      if (isComputerLikeName(name)) {
        showError("玩家昵称不能使用与电脑玩家或系统相似的名称");
        return;
      }
      showError("");
      pendingJoin = {game_id: gameId, name};
      if (socket && socket.readyState === WebSocket.OPEN) {
        if (send({type: "join", ...pendingJoin})) pendingJoin = null;
      } else {
        connect(false);
      }
    });

    $("leave").addEventListener("click", () => {
      clearTimeout(landlordRevealTimer);
      clearTimeout(reconnectTimer);
      if (socket) socket.close();
      location.assign("/");
    });

    if (savedRoom && savedToken) {
      $("join-panel").classList.add("hidden");
      $("game-panel").classList.remove("hidden");
      $("game-code").textContent = savedRoom;
      connect(true);
    } else {
      connect(false);
    }
  </script>
</body>
